services:
  warehaus-api:
    container_name: warehaus-api
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5026:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      DEFAULT_CONNECTION: Host=warehaus-db;Port=5432;Database=warehaus_db;Username=postgres;Password=postgres
    depends_on:
      - warehaus-db

  warehaus-db:
    container_name: warehaus-db
    image: postgres:17
    restart: always
    environment:
      POSTGRES_DB: warehaus_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - warehaus_postgres_data:/var/lib/postgresql/data

volumes:
  warehaus_postgres_data: